<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e12">
<meta name="description" content="Record-level provenance for Agentic Watershed advisories — the full ATProto record and the domain observations behind every synthesis post, fetched live from the federated network.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e12'/%3E%3Cpath d='M4 21c4-3.2 8-3.2 12 0s8 3.2 12 0' fill='none' stroke='%2356b4e9' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M4 13c4-3.2 8-3.2 12 0s8 3.2 12 0' fill='none' stroke='%2356b4e9' stroke-width='2.2' stroke-linecap='round' opacity='.55'/%3E%3C/svg%3E">
<title>Agentic Watershed — Observation Viewer</title>
<link rel="preload" href="fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ---------------------------------------------------------------------------
   Design language: "the watershed at night"
   Deep water ground, ink cards, hairline borders, drawn stroke icons.
   Newsreader carries the product voice (wordmark, advisory summary, domain
   names). JetBrains Mono carries data and provenance — the DID, the URI,
   the reading. System sans carries bulk prose.
--------------------------------------------------------------------------- */
@font-face {
  font-family: "Newsreader";
  src: url("fonts/newsreader-latin-opsz-normal.woff2") format("woff2-variations");
  font-weight: 200 800;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
  font-weight: 400;
  font-display: swap;
}
:root {
  color-scheme: dark;
  --bg: #0a0e12;
  --bg-raised: #0e141b;
  --ink: #10161d;
  --ink-2: #131a23;
  --hairline: rgba(141,166,196,.14);
  --hairline-strong: rgba(141,166,196,.30);
  --text: #e8eef4;
  --text-2: #a8b8c8;
  --text-3: #7a8ca0;
  --water: #56b4e9;
  --river: #4fa3d1;
  --weather: #e8b64f;
  --aqi: #9d8fe0;
  --fire: #e0704a;
  --ok: #3fbf7f;
  --warn: #e0a53c;
  --bad: #e0563c;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
}
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(86,180,233,.28); color: var(--text); }

/* Layout shell */
.shell { max-width: 780px; margin: 0 auto; padding: 0 24px; }
main.shell { padding-top: 4px; padding-bottom: 6rem; }

/* Header + wordmark */
.masthead {
  padding: 48px 0 28px;
  position: relative;
  overflow: visible;
}
.masthead svg.contour {
  position: absolute;
  left: -32px; top: 14px;
  width: 380px; height: 120px;
  pointer-events: none;
  opacity: .5;
}
.masthead svg.contour path {
  fill: none;
  stroke: var(--water);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}
.wordmark {
  position: relative;
  font-family: var(--serif);
  font-weight: 430;
  font-size: 1.7rem;
  letter-spacing: -0.015em;
  line-height: 1.15;
  color: var(--text);
  margin: 0;
}
.wordmark a { color: inherit; text-decoration: none; }
.wordmark .amp { color: var(--water); font-weight: 350; }
.tagline {
  margin: 6px 0 0;
  font-size: .82rem;
  color: var(--text-3);
  letter-spacing: .01em;
}
.tagline .sep { margin: 0 .45em; color: var(--hairline-strong); }

/* Cards */
.card {
  background: var(--ink);
  border: 1px solid var(--hairline);
  border-radius: 14px;
  padding: 28px;
  margin-bottom: 20px;
  transition: border-color .25s var(--ease), transform .25s var(--ease);
}
.card + .card { margin-top: 0; }
.card:hover { border-color: var(--hairline-strong); }

/* Card headers */
.card-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  margin-bottom: 20px;
}
.eyebrow {
  font-family: var(--sans);
  font-size: .68rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .14em;
  color: var(--text-3);
  margin: 0;
}
h1.eyebrow, h2.eyebrow {
  font-family: var(--sans);
  font-size: .68rem;
  font-weight: 600;
}
.head-meta {
  font-family: var(--mono);
  font-size: .72rem;
  color: var(--text-3);
}

/* Risk strip */
.risk-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  margin-bottom: 24px;
}
.risk-item {
  padding: 14px 16px 12px;
  border-right: 1px solid var(--hairline);
}
.risk-item:last-child { border-right: none; }
.risk-label {
  font-size: .65rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--text-3);
  margin-bottom: 5px;
}
.risk-value {
  font-family: var(--mono);
  font-size: .82rem;
  letter-spacing: .02em;
}
.risk-value.unknown { color: var(--text-3); font-style: italic; }
.risk-value.none, .risk-value.low { color: var(--ok); }
.risk-value.moderate { color: var(--warn); }
.risk-value.high, .risk-value.extreme { color: var(--bad); }

/* Advisory summary — the product voice */
.summary {
  font-family: var(--serif);
  font-weight: 380;
  font-size: 1.32rem;
  line-height: 1.48;
  letter-spacing: -0.008em;
  color: var(--text);
  margin: 0 0 28px;
  max-width: 62ch;
}
.reasoning {
  font-size: .92rem;
  line-height: 1.72;
  color: var(--text-2);
  white-space: pre-wrap;
  margin: 0;
  max-width: 70ch;
}
.reasoning-label {
  margin: 28px 0 12px;
}

/* Flagged banner */
.flagged-banner {
  background: rgba(224,165,60,.07);
  border: 1px solid rgba(224,165,60,.25);
  color: var(--warn);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: .88rem;
  margin-bottom: 20px;
}

/* Timestamp line */
.meta {
  font-family: var(--mono);
  font-size: .75rem;
  color: var(--text-3);
  margin: 0;
}
.meta b { color: var(--text-2); font-weight: 400; }

/* Domain blocks */
.domain-block {
  border-top: 1px solid var(--hairline);
  padding: 22px 0;
}
.domain-block:first-of-type { border-top: none; padding-top: 16px; }
.domain-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.domain-icon {
  flex-shrink: 0;
  display: inline-flex;
}
.domain-icon svg { display: block; }
.domain-name {
  font-family: var(--serif);
  font-weight: 480;
  font-size: 1.06rem;
  letter-spacing: -0.01em;
}
.domain-time {
  margin-left: auto;
  font-family: var(--mono);
  font-size: .72rem;
  color: var(--text-3);
  white-space: nowrap;
}
.domain-summary {
  font-size: .92rem;
  line-height: 1.62;
  color: var(--text-2);
  margin: 0 0 14px;
  max-width: 70ch;
}
.numerics {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 22px;
  margin-bottom: 12px;
}
.numeric {
  font-family: var(--mono);
  font-size: .78rem;
  color: var(--text-3);
}
.numeric b { color: var(--text); font-weight: 400; margin-right: 4px; }

/* NWS alerts in effect — empty until the publisher started sending them */
.alerts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.alert-chip {
  font-size: .7rem;
  color: var(--warn);
  border: 1px solid var(--warn);
  border-radius: 5px;
  padding: 2px 7px;
  opacity: .85;
}

/* at-uri chip — unfolds */
.at-uri-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--text-3);
  background: transparent;
  border: 1px solid var(--hairline);
  border-radius: 5px;
  padding: 4px 9px;
  cursor: pointer;
  transition: border-color .2s var(--ease), color .2s var(--ease);
  overflow: hidden;
  max-width: 100%;
}
.at-uri-chip:hover { border-color: var(--hairline-strong); color: var(--text-2); }
.at-uri-chip .uri-full {
  display: none;
  word-break: break-all;
  white-space: normal;
}
.at-uri-chip.open .uri-trunc { display: none; }
.at-uri-chip.open .uri-full { display: inline; }
.at-uri {
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--text-3);
  word-break: break-all;
  margin-top: 10px;
}
.verify-link {
  font-size: .78rem;
  color: var(--water);
  text-decoration: none;
  margin-left: 12px;
}
.verify-link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* Buttons */
.btn {
  font-family: var(--mono);
  font-size: .75rem;
  letter-spacing: .03em;
  padding: 7px 14px;
  background: transparent;
  color: var(--text-2);
  border: 1px solid var(--hairline-strong);
  border-radius: 7px;
  cursor: pointer;
  transition: all .2s var(--ease);
}
.btn:hover { border-color: var(--water); color: var(--water); }
.btn:active { transform: scale(.98); }
.btn-primary {
  background: var(--water);
  color: #07131e;
  border-color: var(--water);
  font-weight: 500;
}
.btn-primary:hover { background: #6cc2ee; color: #07131e; }

/* Focus visibility */
:focus-visible {
  outline: 2px solid rgba(86,180,233,.6);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Loading state + trace */
.state {
  padding: 48px 0;
  text-align: center;
  color: var(--text-3);
  font-size: .88rem;
}
.trace {
  font-family: var(--mono);
  font-size: .72rem;
  color: var(--text-3);
  margin-top: 12px;
  min-height: 1.2em;
  letter-spacing: .01em;
}
.trace b { color: var(--water); font-weight: 400; }

/* Empty state */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-3);
  font-size: .88rem;
}
.empty svg { display: block; margin: 0 auto 14px; opacity: .4; }

/* Error state */
.error {
  color: var(--bad);
  background: rgba(224,86,60,.07);
  border: 1px solid rgba(224,86,60,.22);
  border-radius: 10px;
  padding: 16px 18px;
  font-size: .88rem;
  line-height: 1.6;
}
.error .err-head { font-weight: 600; margin-bottom: 4px; }
.error .err-detail { color: var(--text-2); font-family: var(--mono); font-size: .75rem; }

/* Input */
input[type=text] {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-raised);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--mono);
  font-size: .82rem;
}
input[type=text]::placeholder { color: var(--text-3); }
input[type=text]:focus { border-color: rgba(86,180,233,.45); outline: none; }

/* Footer */
.foot {
  border-top: 1px solid var(--hairline);
  margin-top: 56px;
  padding: 24px 0 40px;
  font-size: .78rem;
  color: var(--text-3);
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  justify-content: space-between;
  align-items: baseline;
}
.foot a { color: var(--text-2); text-decoration: none; }
.foot a:hover { color: var(--water); }

/* Print — a page whose literal job is producing receipts */
@media print {
  :root { --bg: #fff; --ink: #fff; --ink-2: #fff; --text: #111; --text-2: #333; --text-3: #555;
          --water: #036; --river: #036; --weather: #7a5200; --aqi: #444; --fire: #a03000;
          --ok: #0a6b3a; --warn: #7a5200; --bad: #a03000;
          --hairline: rgba(0,0,0,.18); --hairline-strong: rgba(0,0,0,.35); }
  body { background: #fff; }
  .card { border-color: rgba(0,0,0,.25); box-shadow: none; break-inside: avoid; }
  .flagged-banner, .error { background: #fff; }
  .raw, .trace, .risk-value.unknown, .risk-value.none, .risk-value.low, .risk-value.moderate, .risk-value.high, .risk-value.extreme { color: #111; }
  .masthead svg.contour, .domain-icon svg, .foot a[href^="http"] { color: #036; }
  .btn, .raw-record, .at-uri-chip { display: none; }
}

/* Entrance choreography — one authored moment */
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.rise { animation: rise .55s var(--ease) backwards; }
.rise-1 { animation-delay: .04s; }
.rise-2 { animation-delay: .12s; }
.rise-3 { animation-delay: .2s; }
.rise-4 { animation-delay: .28s; }
.rise-5 { animation-delay: .36s; }

/* Raw-record disclosure — native <details>, so keyboard and assistive
   tech get the toggle for free. Shows the full PDS envelope, not a
   reconstruction: getRecord gives {uri, cid, value}, listRecords entries
   give {uri, value}. */
.raw-record { margin-top: 14px; }
.raw-record summary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: .72rem;
  color: var(--text-3);
  user-select: none;
  list-style: none;
  transition: color .2s var(--ease);
}
.raw-record summary::-webkit-details-marker { display: none; }
.raw-record summary::before {
  content: "";
  width: 0; height: 0;
  border-left: 4px solid currentColor;
  border-top: 3.5px solid transparent;
  border-bottom: 3.5px solid transparent;
  transition: transform .2s var(--ease);
}
.raw-record[open] summary::before { transform: rotate(90deg); }
.raw-record summary:hover { color: var(--water); }
.raw-record pre {
  margin: 10px 0 0;
  padding: 14px;
  background: var(--bg-raised);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  font-family: var(--mono);
  font-size: .72rem;
  line-height: 1.65;
  color: var(--text-2);
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 400px;
  overflow-y: auto;
  animation: rise .35s var(--ease);
}
.raw-record pre::-webkit-scrollbar { width: 10px; }
.raw-record pre::-webkit-scrollbar-track { background: transparent; }
.raw-record pre::-webkit-scrollbar-thumb { background: var(--hairline-strong); border-radius: 5px; border: 2px solid var(--bg-raised); }
.raw-record pre { scrollbar-width: thin; scrollbar-color: var(--hairline-strong) transparent; }

/* Responsive */
@media (max-width: 640px) {
  .shell { padding-left: 18px; padding-right: 18px; }
  .masthead { padding-top: 36px; }
  .wordmark { font-size: 1.42rem; }
  .card { padding: 20px; }
  .risk-strip { grid-template-columns: 1fr 1fr; }
  .risk-item:nth-child(2) { border-right: none; }
  .risk-item:nth-child(-n+2) { border-bottom: 1px solid var(--hairline); }
  .summary { font-size: 1.18rem; }
  .domain-time { display: none; }
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<header class="shell masthead">
  <svg class="contour" viewBox="0 0 380 120" aria-hidden="true">
    <path d="M0 88 Q60 74 120 84 T240 80 T380 88"/>
    <path d="M0 66 Q80 52 150 62 T300 58 T380 66" opacity=".7"/>
    <path d="M0 44 Q70 32 140 42 T280 38 T380 46" opacity=".45"/>
    <path d="M0 24 Q90 16 170 24 T320 20 T380 26" opacity=".25"/>
  </svg>
  <h1 class="wordmark"><a href="./">Agentic <span class="amp">Watershed</span></a></h1>
  <p class="tagline">Observation Viewer<span class="sep">·</span>record-level provenance for every advisory<span class="sep">·</span><a href="https://github.com/cprice-ping/Agentic-Watershed" style="color:var(--text-2); text-decoration:none;">about the system</a></p>
</header>

<main class="shell">
  <div id="app"><div class="state">Loading…</div></div>
</main>

<footer class="shell foot">
  <span>Agents on a Raspberry Pi in Napa, California, publishing under their own DID.</span>
  <a href="https://github.com/cprice-ping/Agentic-Watershed">github.com/cprice-ping/Agentic-Watershed</a>
</footer>

<script>
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------

const LEXICON = "net.cpricedomain.temp.monitor.observation";
// Fallback only. Synthesis records now carry sourceRecords — the at:// URIs
// the run actually read — and those are used verbatim when present. This
// window reconstructs the set for older records that predate that field, and
// it has never been exactly right: it claimed to match the subscriber, which
// was fetching 15h at the time and 27h since, so it showed observations the
// advisory had not seen. Reconstruction is a guess; sourceRecords is a fact.
const LOOKBACK_HOURS = 24;
const PLC_DIRECTORY = "https://plc.directory";

// napa-synth-01 — the synthesis identity that publishes advisory records.
// Only one today; hardcoded rather than a config file since (unlike node
// publishers) there's exactly one of these by design.
const SYNTHESIS_DID = "did:plc:clcw2dxrd6qma45gy3oozjwa";

// Trusted node publishers — mirrors Synthesis/publishers.json in the repo.
// Keep these in sync; this file has no server, so it can't read the repo's
// copy directly.
let TRUSTED_PUBLISHERS = { "did:plc:ggztd5hjk3cnkhgzdk4rmqan": "napa-node-01" };

// ---------------------------------------------------------------------------
// ATProto helpers — all reads are public/unauthenticated, no backend needed
// ---------------------------------------------------------------------------

function parseAtUri(uri) {
  const m = uri.match(/^at:\/\/([^/]+)\/([^/]+)\/([^/]+)$/);
  if (!m) throw new Error("Not a valid at:// URI: " + uri);
  return { did: m[1], collection: m[2], rkey: m[3] };
}

// Fetch-pipeline trace: each stage of resolving a DID → fetching a record
// updates the loading panel, so the wait reads as the protocol working
// (resolve identity → locate PDS → read records), not as a spinner.
let traceEl = null;
function trace(msg) {
  if (traceEl) traceEl.innerHTML = msg;
}

// Shared DOM scaffold for the loading state. role=status announces each
// trace update to screen readers as the pipeline advances.
function loadingHtml() {
  return `<div class="state" role="status"><div class="trace" id="trace"></div></div>`;
}

const pdsCache = {};
async function resolvePds(did) {
  if (pdsCache[did]) return pdsCache[did];
  if (did.startsWith("did:plc:")) {
    trace(`resolving identity <b>${esc(did)}</b>`);
    const resp = await fetch(`${PLC_DIRECTORY}/${encodeURIComponent(did)}`);
    if (!resp.ok) throw new Error(`Could not resolve DID ${did} (${resp.status})`);
    const doc = await resp.json();
    const svc = (doc.service || []).find(s => s.id === "#atproto_pds");
    if (!svc) throw new Error(`No PDS service endpoint in DID document for ${did}`);
    pdsCache[did] = svc.serviceEndpoint;
    trace(`PDS located <b>${esc(new URL(svc.serviceEndpoint).host)}</b>`);
    return svc.serviceEndpoint;
  }
  throw new Error(`Unsupported DID method: ${did}`);
}

async function getRecord(uri) {
  const { did, collection, rkey } = parseAtUri(uri);
  const pds = await resolvePds(did);
  const url = `${pds}/xrpc/com.atproto.repo.getRecord?repo=${encodeURIComponent(did)}&collection=${encodeURIComponent(collection)}&rkey=${encodeURIComponent(rkey)}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`getRecord failed (${resp.status}) for ${uri}`);
  return resp.json();
}

async function listRecords(did, collection, limit = 100) {
  const pds = await resolvePds(did);
  const url = `${pds}/xrpc/com.atproto.repo.listRecords?repo=${encodeURIComponent(did)}&collection=${encodeURIComponent(collection)}&limit=${limit}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`listRecords failed (${resp.status}) for ${did}`);
  const data = await resp.json();
  return data.records || [];
}

// listRecords returns newest-first by default (rkeys are time-sortable
// TIDs) — same assumption Synthesis/subscriber.py relies on for its
// early-exit-on-cutoff logic, so a small limit is enough here.
async function getLatestSynthesisUri() {
  const records = await listRecords(SYNTHESIS_DID, LEXICON, 5);
  const latest = records.find(r => (r.value || {}).observationType === `${LEXICON}#synthesis`);
  if (!latest) throw new Error("No synthesis records found yet.");
  return latest.uri;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// Risk hue: maps a risk word to the domain colour it should wear.
function riskColor(value) {
  const v = (value || "none").toLowerCase();
  if (v === "none" || v === "low") return "var(--ok)";
  if (v === "moderate") return "var(--warn)";
  if (v === "high" || v === "extreme") return "var(--bad)";
  return "var(--text-3)";
}

// ---------------------------------------------------------------------------
// Icons — drawn, one consistent 1.5px stroke, 16×16 viewBox.
// River = current lines, Weather = wind streamlines, AQI = haze bands,
// Fire = angular flame. No emoji, no icon-font, no library fetch.
// ---------------------------------------------------------------------------

const ICONS = {
  refresh: `<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/>
    <path d="M13.5 1.5v3h-3"/>
  </svg>`,
  river: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M1 5.5c2-1.6 4-1.6 6 0s4 1.6 6 0"/>
    <path d="M1 9.5c2-1.6 4-1.6 6 0s4 1.6 6 0"/>
    <path d="M1 13.5c2-1.6 4-1.6 6 0s4 1.6 6 0"/>
  </svg>`,
  weather: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M2 6.5h7.5a2.2 2.2 0 1 0-2.2-3"/>
    <path d="M2 11h5"/>
  </svg>`,
  aqi: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
    <path d="M2.5 4.5h11"/>
    <path d="M2.5 8.5h8"/>
    <path d="M2.5 12.5h5"/>
  </svg>`,
  fire: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M8 2l3.8 5.8a4.4 4.4 0 1 1-7.6 0L8 2z"/>
  </svg>`,
  droplet: `<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 4c3.5 5 7 8.5 7 12.5a7 7 0 1 1-14 0C7 12.5 10.5 9 14 4z"/>
  </svg>`,
};

const DOMAIN_META = {
  watershed:{ label: "Watershed", color: "var(--river)" },
  weather:  { label: "Weather",  color: "var(--weather)" },
  aqi:      { label: "Air Quality", color: "var(--aqi)" },
  fire:     { label: "Fire",     color: "var(--fire)" },
};

function domainIcon(type) {
  const meta = DOMAIN_META[type] || { color: "var(--text-3)" };
  const svg = ICONS[type] || ICONS.droplet;
  return `<span class="domain-icon" style="color:${meta.color}">${svg}</span>`;
}
function domainLabel(type) {
  return (DOMAIN_META[type] || { label: type }).label;
}

// Unfoldable at-uri chip: shows the record's rkey when collapsed, the full
// at:// URI when expanded. Click to toggle. Provenance is content.
function atUriChip(uri, open = false) {
  let rkey = uri;
  try { rkey = parseAtUri(uri).rkey; } catch {}
  return `<button class="at-uri-chip${open ? " open" : ""}" data-uri="${esc(uri)}" title="Toggle full at:// URI">
    <span class="uri-trunc">at://…/${esc(rkey)}</span>
    <span class="uri-full">${esc(uri)}</span>
  </button>`;
}

// Formatted timestamp wrapped in <time> for machine-readable provenance.
function fmtTime(iso) {
  if (!iso) return "unknown time";
  try {
    const t = new Date(iso).toLocaleString(undefined, {
      weekday: "short", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit", timeZoneName: "short",
    });
    return `<time datetime="${esc(iso)}">${esc(t)}</time>`;
  } catch { return esc(iso); }
}

const NUMERIC_FIELD_LABELS = {
  temperatureF: ["Temp", "°F"], humidityPct: ["Humidity", "%"],
  windSpeedMph: ["Wind", "mph"], windGustMph: ["Gust", "mph"],
  windDirectionDeg: ["Wind dir", "°"], precipMm24h: ["Precip 24h", "mm"],
  windPattern: ["Wind pattern", ""],
  // Weather records published before the lexicon fix used the collector's
  // raw column names. Kept so older records still render.
  temperature_f: ["Temp", "°F"], humidity_pct: ["Humidity", "%"],
  wind_speed_mph: ["Wind", "mph"], wind_gust_mph: ["Gust", "mph"],
  wind_direction_deg: ["Wind dir", "°"], precip_24h_mm: ["Precip 24h", "mm"],
  dischargeMinCfs: ["Discharge min", "cfs"], dischargeMeanCfs: ["Discharge mean", "cfs"],
  dischargeMaxCfs: ["Discharge max", "cfs"],
  gageHeightMinFt: ["Gage min", "ft"], gageHeightMaxFt: ["Gage max", "ft"],
  sevenDayTrend: ["7-day trend", ""],
  // Pre-aggregation records carry a single station's reading under these
  // names. Kept so older records still render rather than going blank.
  dischargeCfs: ["Discharge", "cfs"], gageHeightFt: ["Gage height", "ft"],
  pm25Aqi: ["PM2.5 AQI", ""], ozoneAqi: ["Ozone AQI", ""],
  nearestHotspotDistanceMi: ["Nearest hotspot", "mi"],
  nearestHotspotConfidence: ["Confidence", ""],
  nearestHotspotFrpMw: ["FRP", "MW"],
  hotspotCount: ["Hotspots (6h)", ""],
};

// NWS alert names in effect at observedAt. Absent on every record published
// before the publisher started reading the collector's alerts table.
function renderAlerts(block) {
  const alerts = (block && block.activeAlerts) || [];
  if (!Array.isArray(alerts) || !alerts.length) return "";
  return `<div class="alerts">${alerts
    .map((a) => `<span class="alert-chip">${esc(String(a))}</span>`)
    .join("")}</div>`;
}

function renderNumericFields(block) {
  if (!block) return "";
  const items = Object.entries(NUMERIC_FIELD_LABELS)
    .filter(([key]) => block[key] !== undefined && block[key] !== null)
    .map(([key, [label, unit]]) => `<span class="numeric"><b>${esc(String(block[key]))}${esc(unit)}</b>${esc(label)}</span>`);
  return items.length ? `<div class="numerics">${items.join("")}</div>` : "";
}

// A missing risk value is not "none". Rendering it that way was the same
// defect the lexicon had: absence of an assessment shown as the calmest
// possible reading. "unknown" is a real value in the vocabulary now, and
// an absent one falls back to it rather than to reassurance.
function riskValue(value) {
  const v = (value || "unknown").toLowerCase();
  return `<span class="risk-value ${esc(v)}">${esc(v)}</span>`;
}

// Collapsed raw-record view. Takes whatever the PDS actually returned —
// getRecord gives {uri, cid, value}, listRecords entries give {uri, value} —
// so the disclosure shows the real response rather than a reconstruction of
// it, including any field this Viewer doesn't know how to render.
function rawRecord(record, label = "Raw record") {
  let json;
  try {
    json = JSON.stringify(record, null, 2);
  } catch (err) {
    // Nothing off a PDS should be circular, but a render helper is the wrong
    // place to throw — a broken disclosure must not take the card down.
    return `<div class="meta">Couldn't serialise this record: ${esc(err.message)}</div>`;
  }
  return `<details class="raw-record">`
       + `<summary>${esc(label)} (JSON)</summary>`
       + `<pre>${esc(json)}</pre>`
       + `</details>`;
}

// ---------------------------------------------------------------------------
// Main render
// ---------------------------------------------------------------------------

async function render(uri) {
  const app = document.getElementById("app");
  app.innerHTML = loadingHtml();
  traceEl = document.getElementById("trace");

  let synthRecord;
  try {
    synthRecord = await getRecord(uri);
  } catch (err) {
    app.innerHTML = `
      <div class="error">
        <div class="err-head">Couldn't load that record</div>
        <div class="err-detail">${esc(err.message)}</div>
        <div style="margin-top:12px; font-size:.82rem; color:var(--text-2);">
          The record may have been deleted, or its PDS may be unreachable from this browser.
          Check the at:// URI and try again, or <a href="./" style="color:var(--water);">load the current advisory</a>.
        </div>
      </div>`;
    traceEl = null;
    return;
  }
  traceEl = null;

  const v = synthRecord.value || {};
  const synth = v.synthesis || {};
  const observedAt = v.observedAt;

  let html = "";
  html += `<article class="card rise rise-1">`;
  html += `<div class="card-head">`;
  html += `<h1 class="eyebrow">Synthesis Advisory</h1>`;
  html += `<button class="btn" id="get-current-btn">${ICONS.refresh} Latest</button>`;
  html += `</div>`;

  if (v.flagged) {
    html += `<div class="flagged-banner">Flagged${v.flagReason ? ` — ${esc(v.flagReason)}` : ""}</div>`;
  }

  html += `<div class="risk-strip">`;
  html += `<div class="risk-item"><div class="risk-label">Overall</div>${riskValue(synth.overallRisk)}</div>`;
  html += `<div class="risk-item"><div class="risk-label">Fire</div>${riskValue(synth.fireRisk)}</div>`;
  html += `<div class="risk-item"><div class="risk-label">Flood</div>${riskValue(synth.floodRisk)}</div>`;
  html += `<div class="risk-item"><div class="risk-label">Air Quality</div>${riskValue(synth.airQualityRisk)}</div>`;
  html += `</div>`;

  html += `<p class="summary">${esc(v.summary || "")}</p>`;
  html += `<p class="meta">${fmtTime(observedAt)}${v.agentModel ? ` · <b>${esc(v.agentModel)}</b>` : ""}</p>`;

  if (synth.reasoning) {
    html += `<h2 class="eyebrow reasoning-label">Full reasoning</h2>`;
    html += `<div class="reasoning" role="article" aria-label="Full reasoning">${esc(synth.reasoning)}</div>`;
  }

  // Provenance footer — the raw record, unfoldable. Full envelope: the
  // real PDS response, including any field this card doesn't render.
  html += rawRecord(synthRecord, "Raw synthesis record");

  html += `<div class="at-uri">${atUriChip(uri)}</div>`;
  html += `</article>`;

  app.innerHTML = html;
  document.getElementById("get-current-btn").addEventListener("click", goToCurrent);
  for (const chip of app.querySelectorAll(".at-uri-chip")) {
    chip.addEventListener("click", () => chip.classList.toggle("open"));
  }

  // Underlying domain records this synthesis run drew from. sourceRecords
  // names them exactly; the lookback window below is only for records
  // published before that field existed.
  const sourceUris = Array.isArray(synth.sourceRecords) ? synth.sourceRecords : null;
  const domainSection = document.createElement("section");
  domainSection.className = "card rise rise-3";
  domainSection.setAttribute("aria-label", "Underlying domain observations");
  domainSection.innerHTML = `
    <div class="card-head">
      <h2 class="eyebrow">Underlying Observations</h2>
      <span class="head-meta">${sourceUris && sourceUris.length
        ? `${sourceUris.length} record${sourceUris.length === 1 ? "" : "s"} this run read`
        : `last ${LOOKBACK_HOURS}h (estimated)`} · newest first</span>
    </div>
    <div class="state" style="padding:12px 0;"><div class="trace" id="trace-2"></div></div>`;
  app.appendChild(domainSection);
  traceEl = document.getElementById("trace-2");

  try {
    const cutoff = observedAt ? new Date(observedAt).getTime() - LOOKBACK_HOURS * 3600 * 1000 : null;
    const upper = observedAt ? new Date(observedAt).getTime() : null;

    // Fetch every trusted publisher in parallel — one PDS round-trip each,
    // not a serialized chain.
    let allDomainRecords = [];
    const perDid = await Promise.all(
      Object.keys(TRUSTED_PUBLISHERS).map(did => listRecords(did, LEXICON))
    );
    for (const records of perDid) {
      allDomainRecords.push(...records.filter(r => (r.value || {}).observationType !== `${LEXICON}#synthesis`));
    }

    // Prefer the record's own account of what it read. Filtering the already
    // fetched list by URI costs no extra round trips and, unlike the window,
    // cannot include something the advisory never saw or omit something it did.
    if (sourceUris && sourceUris.length) {
      const wanted = new Set(sourceUris);
      allDomainRecords = allDomainRecords.filter(r => wanted.has(r.uri));
    } else if (upper !== null) {
      allDomainRecords = allDomainRecords.filter(r => {
        const t = new Date((r.value || {}).observedAt || 0).getTime();
        return t <= upper && t >= cutoff;
      });
    }

    if (!allDomainRecords.length) {
      domainSection.innerHTML = `
        <div class="card-head">
          <h2 class="eyebrow">Underlying Observations</h2>
          <span class="head-meta">${sourceUris && sourceUris.length
            ? "none resolved" : `last ${LOOKBACK_HOURS}h (estimated)`}</span>
        </div>
        <div class="empty">
          ${ICONS.droplet}
          <p>${sourceUris && sourceUris.length
            ? `This advisory names ${sourceUris.length} source record${sourceUris.length === 1 ? "" : "s"}, but none could be
               retrieved — they may have been deleted, or their PDS may be unreachable from this browser.`
            : `No domain records in the ${LOOKBACK_HOURS}h window before this observation.<br>
               They may have aged out, or the node hadn't published yet.`}</p>
        </div>`;
      return;
    }

    // Newest first — a domain agent runs every 6h, so multiple records per
    // domain can land in the 24h window. Oldest-first buried the freshest
    // state at the bottom of a long list, making stale data look current
    // (the record you'd actually notice, at the top, was the stalest one
    // still in-window). See CONTEXT.md if this surfaces again.
    allDomainRecords.sort((a, b) => new Date((b.value||{}).observedAt||0) - new Date((a.value||{}).observedAt||0));

    let blocks = "";
    allDomainRecords.forEach((rec, i) => {
      const rv = rec.value || {};
      const type = (rv.observationType || "").split("#")[1] || "unknown";
      const domainBlock = rv[type] || {};
      const delayClass = `rise-${Math.min(i + 2, 5)}`;
      blocks += `<div class="domain-block rise ${delayClass}">`;
      blocks += `<div class="domain-head">`;
      blocks += domainIcon(type);
      blocks += `<h3 class="domain-name">${esc(domainLabel(type))}</h3>`;
      if (rv.flagged) blocks += `<span style="color:var(--warn); font-size:.72rem; font-weight:500;">flagged</span>`;
      blocks += `<span class="domain-time">${fmtTime(rv.observedAt)}</span>`;
      blocks += `</div>`;
      blocks += `<p class="domain-summary">${esc(rv.summary || "")}</p>`;
      blocks += renderAlerts(domainBlock);
      blocks += renderNumericFields(domainBlock);
      blocks += atUriChip(rec.uri);
      blocks += rawRecord(rec);
      blocks += `</div>`;
    });

    // A named record that no longer resolves must be said out loud, not
    // quietly dropped. Showing 12 blocks when the advisory cited 15 would
    // look complete while being short, which is the failure this whole
    // section exists to prevent.
    const shortfall = sourceUris && sourceUris.length
      ? sourceUris.length - allDomainRecords.length : 0;
    const shortfallNote = shortfall > 0
      ? `<p class="empty" style="padding:10px 0 0; text-align:left;">
           ${shortfall} of the ${sourceUris.length} record${sourceUris.length === 1 ? "" : "s"}
           this advisory cited could not be retrieved. They may have been deleted,
           or their PDS may be unreachable from this browser.</p>`
      : "";

    domainSection.innerHTML = `
      <div class="card-head">
        <h2 class="eyebrow">Underlying Observations</h2>
        <span class="head-meta">${sourceUris && sourceUris.length
          ? `${allDomainRecords.length} of ${sourceUris.length} this run read`
          : `last ${LOOKBACK_HOURS}h (estimated)`} · newest first</span>
      </div>
      ${blocks}${shortfallNote}`;
    traceEl = null;

    for (const chip of domainSection.querySelectorAll(".at-uri-chip")) {
      chip.addEventListener("click", () => chip.classList.toggle("open"));
    }
  } catch (err) {
    traceEl = null;
    domainSection.innerHTML = `
      <div class="card-head">
        <h2 class="eyebrow">Underlying Observations</h2>
      </div>
      <div class="error">
        <div class="err-head">Couldn't fetch the domain records</div>
        <div class="err-detail">${esc(err.message)}</div>
      </div>`;
  }
}

function goToUri(uri) {
  const url = new URL(window.location);
  url.searchParams.set("uri", uri);
  window.history.replaceState({}, "", url);
  render(uri);
}

async function goToCurrent() {
  const app = document.getElementById("app");
  app.innerHTML = loadingHtml();
  traceEl = document.getElementById("trace");
  try {
    const uri = await getLatestSynthesisUri();
    goToUri(uri);
  } catch (err) {
    app.innerHTML = `
      <div class="error">
        <div class="err-head">Couldn't fetch the current advisory</div>
        <div class="err-detail">${esc(err.message)}</div>
        <div style="margin-top:12px; font-size:.82rem; color:var(--text-2);">
          The synthesis PDS may be unreachable from this browser.
          <a href="./" style="color:var(--water);">Reload the page</a> to try again.
        </div>
      </div>`;
    traceEl = null;
  }
}

function renderPrompt(autoFetchError) {
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card rise rise-1">
      <div class="card-head">
        <h2 class="eyebrow">Current Advisory</h2>
      </div>
      ${autoFetchError ? `<div class="error" style="margin-bottom:16px;">${esc(autoFetchError)}</div>` : ""}
      <button class="btn btn-primary" id="get-current-btn">${ICONS.refresh} Load latest</button>
    </div>
    <div class="card rise rise-2">
      <div class="card-head">
        <h2 class="eyebrow">Or load a specific record</h2>
      </div>
      <p class="meta" style="margin-bottom:12px;">Paste an <b>at://</b> record URI — from a Synthesis advisory post's link, or from a domain agent's lexicon record.</p>
      <form id="uri-form">
        <label for="uri-input" class="eyebrow" style="display:block; margin-bottom:6px;">Record URI</label>
        <input type="text" id="uri-input" placeholder="at://did:plc:.../net.cpricedomain.temp.monitor.observation/..." autocomplete="off" spellcheck="false">
        <button class="btn" id="go-btn" style="margin-top:12px;">Load record</button>
      </form>
    </div>`;
  document.getElementById("get-current-btn").addEventListener("click", goToCurrent);
  document.getElementById("uri-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const uri = document.getElementById("uri-input").value.trim();
    if (uri) goToUri(uri);
  });
}

async function main() {
  try {
    const resp = await fetch("./publishers.json");
    if (resp.ok) TRUSTED_PUBLISHERS = await resp.json();
  } catch { /* fall back to the embedded default */ }

  const params = new URLSearchParams(window.location.search);
  const uri = params.get("uri");
  if (uri) {
    render(uri);
    return;
  }

  // Bare landing (no ?uri=) — fetch and show the current advisory automatically.
  const app = document.getElementById("app");
  app.innerHTML = loadingHtml();
  traceEl = document.getElementById("trace");
  try {
    const latest = await getLatestSynthesisUri();
    goToUri(latest);
  } catch (err) {
    traceEl = null;
    renderPrompt(`Couldn't auto-load the current advisory: ${err.message}`);
  }
}

main();
</script>
</body>
</html>
